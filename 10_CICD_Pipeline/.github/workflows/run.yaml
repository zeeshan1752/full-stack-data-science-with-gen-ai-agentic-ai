
name: Python ML CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 10_CICD_Pipeline/code-1/requirements.txt

      - name: Run Python ML Script
        run: |
          cd 10_CICD_Pipeline/code-1
          python mlcode.py
